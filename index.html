<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LessonBot • Zoom</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #222;
        }

        #app {
            text-align: center;
            padding: 20px;
        }

        h2 {
            margin: 0 0 10px;
            font-size: 22px;
            font-weight: 500;
        }

        p {
            margin: 0;
            color: #666;
            font-size: 15px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            border-radius: 6px;
            background: #2d8cff;
            color: #fff;
            text-decoration: none;
        }

        .button:hover {
            background: #2681e8;
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <script>
        const app = document.getElementById("app");
        const parts = location.search.slice(1).split("/");

        if (parts.length === 2 && parts[0] && parts[1]) {
            const id = parts[0].replace(/\D/g, "");
            const password = parts[1];

            if (id && password) {
                const mobile = /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent);
                const pwd = encodeURIComponent(password);

                let zoom;

                if (mobile) {
                    zoom = `zoomus://zoom.us/join?confno=${id}&pwd=${pwd}`;
                } else {
                    zoom = `zoommtg://zoom.us/join?confno=${id}&pwd=${pwd}`;
                }

                app.innerHTML = "<h2>Открытие Zoom...</h2>";
                location.href = zoom;

                setTimeout(() => {
                    app.innerHTML = `
                        <h2>Не удалось открыть Zoom</h2>
                        <p>Нажмите кнопку ниже, чтобы открыть Zoom вручную.</p>
                        <a class="button" href="${zoom}">Открыть Zoom</a>
                    `;
                }, 2000);
            }
        }
    </script>
</body>
</html>
