<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LessonBot • Zoom</title>

    <script>
        const parts = location.pathname.split("/").filter(Boolean);

        if (parts.length === 3) {
            location.replace(
                "/" + parts[0] + "/?" +
                parts[1] + "/" +
                parts[2]
            );
        }
    </script>
</head>

<body></body>
</html>
