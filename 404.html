<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LessonBot • Zoom</title>

    <script>
        const parts = location.pathname.split("/").filter(Boolean);
        const base = "/" + parts[0] + "/";

        if (parts.length === 3) {
            sessionStorage.setItem("zoomId", parts[1]);
            sessionStorage.setItem("zoomPassword", parts[2]);

            location.replace(base);
        } else {
            location.replace(base);
        }
    </script>
</head>

<body></body>
</html>
